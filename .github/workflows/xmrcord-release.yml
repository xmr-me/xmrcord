name: Xmrcord Release
# Rebuilds Xmrcord (Equicord base + our plugins) on every push to main and publishes the
# desktop bundle to the "latest" release. Installed clients read this release and auto-update.

on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/xmrcord-release.yml
            - src/**
            - scripts/build/**
            - package.json
            - pnpm-lock.yaml
    workflow_dispatch: {}

concurrency:
    group: xmrcord-release
    cancel-in-progress: true

env:
    FORCE_COLOR: true
    # Baked into the build so clients check THIS repo's releases for updates.
    EQUICORD_REMOTE: ${{ github.repository }}

permissions:
    contents: write

jobs:
    Release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4 # version comes from the packageManager key in package.json

            - name: Use Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build standalone (desktop.asar + equibop.asar)
              run: pnpm build --standalone

            - name: Publish to the "latest" release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # The updater compares the release title's trailing token to the FULL commit hash.
                  TAG=$(git rev-parse HEAD)
                  TITLE="Xmrcord $TAG"
                  NOTES="Build automática — Equicord + Vencord + plugins do Xmrcord. Os clientes instalados se atualizam sozinhos."

                  if gh release view latest >/dev/null 2>&1; then
                      gh release edit latest --title "$TITLE" --notes "$NOTES" --latest
                      gh release upload latest dist/desktop.asar dist/equibop.asar --clobber
                  else
                      gh release create latest dist/desktop.asar dist/equibop.asar --title "$TITLE" --notes "$NOTES" --latest
                  fi
